name: MatCount Windows and verified offline prerelease

on:
  pull_request:
  push:
    branches: [release/offline-faculty-rc2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Parse PowerShell acceptance and launcher scripts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            $parseTokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $parseErrors | Out-String | Write-Error; exit 1 }
          }
          Write-Output 'PowerShell syntax: PASS; live database acceptance remains pending.'
      - name: Install exact hashed Windows dependencies
        run: python -m pip install --require-hashes -r requirements-windows.lock.txt
      - name: Run clean Windows source gates
        shell: pwsh
        run: |
          python scripts/validate_offline_candidate.py --root . --output "$env:RUNNER_TEMP/windows-validation-result.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: windows-candidate-evidence
          path: ${{ runner.temp }}/windows-validation-result.json
          if-no-files-found: error
          retention-days: 14

  package-publish:
    needs: windows-candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/offline-faculty-rc2' && github.repository == 'DevenGaikwad/MatCount'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
      - name: Install exact hashed Linux dependencies
        run: python -m pip install --require-hashes -r requirements-linux.lock.txt
      - name: Package exact reviewed source and verify clean extraction
        run: python scripts/package_offline_demo.py --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/matcount-rc2"
      - name: Validate extracted release bytes
        run: |
          CANDIDATE_ROOT=$(python -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/matcount-rc2/package-result.json"))["clean_root"])')
          python "$CANDIDATE_ROOT/scripts/validate_offline_candidate.py" --root "$CANDIDATE_ROOT" --output "$RUNNER_TEMP/matcount-rc2/validation-result.json"
      - name: Generate evidence from observed results
        run: python scripts/write_candidate_report.py --directory "$RUNNER_TEMP/matcount-rc2"
      - name: Publish prerelease and verify every downloaded asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_verified_candidate.py --directory "$RUNNER_TEMP/matcount-rc2"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: verified-matcount-offline-rc2
          path: |
            ${{ runner.temp }}/matcount-rc2/*.zip
            ${{ runner.temp }}/matcount-rc2/*.sha256
            ${{ runner.temp }}/matcount-rc2/*_FILE_MANIFEST_SHA256.txt
            ${{ runner.temp }}/matcount-rc2/*_VALIDATION_REPORT.md
            ${{ runner.temp }}/matcount-rc2/*-result.json
          if-no-files-found: error
          retention-days: 14
