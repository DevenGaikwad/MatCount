name: MatCount source and frontend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-linux.lock.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Validate server-independent project contract
        run: python scripts/validate_project.py

      - name: Dedicated API regression
        run: python -m pytest -q tests/api

      - name: Focused RBAC and financial data policy
        run: python -m pytest -q tests/test_data_policy.py tests/test_service_security.py tests/api/test_api_contract.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Verify runtime pairing and negative lint probes
        working-directory: frontend
        run: npm run check:tooling

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build
